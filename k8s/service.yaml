apiVersion: v1
kind: Service
metadata:
  name: kisansense
  namespace: kisansense
  labels: { app: kisansense }
spec:
  type: NodePort                   # use LoadBalancer on EKS, or put an Ingress in front
  selector:
    app: kisansense                # matches both stable and canary pods
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
