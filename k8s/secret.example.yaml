# Copy to k8s/secret.yaml (git-ignored), change the key, then: kubectl apply -f k8s/secret.yaml
# Or skip the file entirely:
#   kubectl -n kisansense create secret generic kisansense-secret --from-literal=api-key=<your-key>
apiVersion: v1
kind: Secret
metadata:
  name: kisansense-secret
  namespace: kisansense
type: Opaque
stringData:
  api-key: change-me
