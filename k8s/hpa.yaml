# Needs metrics-server (kind and k3s: install it; EKS: install the add-on).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kisansense
  namespace: kisansense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kisansense
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
