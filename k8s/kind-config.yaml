# kind cluster that exposes the Service NodePort (30080) on your machine.
# With this, http://127.0.0.1:30080 goes through the Kubernetes Service and is load-balanced
# across all pods, which keeps working during rolling updates and makes the HPA demo work.
# (kubectl port-forward pins to one pod and breaks when that pod is replaced.)
#   kind create cluster --name kisansense --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
