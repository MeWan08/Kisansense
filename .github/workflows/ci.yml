name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: kisansense
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      # Pull the dataset from the DVC remote when credentials exist, else fall back to synthetic data.
      - name: Get data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull data/raw/Crop_recommendation.csv || python src/make_dataset.py

      - name: Validate data
        run: python src/validate.py data/raw/Crop_recommendation.csv

      - name: Unit tests
        run: pytest -q

      - name: Train
        run: python src/train.py

      - name: Quality gate
        run: python src/gate.py

      - name: Promote in registry
        run: python src/promote.py

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-bundle
          path: |
            model.joblib
            data/reference.csv
            metrics.json
